version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: grant-agent-db
    environment:
      POSTGRES_DB: grant_agent
      POSTGRES_USER: grant_user
      POSTGRES_PASSWORD: secure_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grant_user -d grant_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: grant-agent-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://grant_user:secure_dev_password@postgres:5432/grant_agent
      ENVIRONMENT: development
      DEBUG: "True"
      SECRET_KEY: grant-agent-local-secret-key-123456789
    ports:
      - "8000:8080"
    volumes:
      - ../vault_storage:/app/vault_storage
      - ../browser_screenshots:/app/browser_screenshots

  mock-portal:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: grant-agent-mock-portal
    command: ["uvicorn", "mock_grant_portal.server:app", "--host", "0.0.0.0", "--port", "8088"]
    ports:
      - "8088:8088"

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    container_name: grant-agent-web
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    container_name: grant-agent-worker
    depends_on:
      - api
      - mock-portal
    environment:
      DATABASE_URL: postgresql://grant_user:secure_dev_password@postgres:5432/grant_agent
      MOCK_PORTAL_URL: http://mock-portal:8088
    volumes:
      - ../vault_storage:/app/vault_storage
      - ../browser_screenshots:/app/browser_screenshots


volumes:
  pgdata:
